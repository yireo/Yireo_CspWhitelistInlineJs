aliases: []
summary: Whitelisted blocks add CSP nonces to injected and dynamic inline scripts
details: >
  Before version 1.0.0, every inline script in the HTML output of a whitelisted block received a CSP
  nonce or hash, including the output of child blocks and scripts containing dynamic (PHP) output.
  The container head.additional was whitelisted by default. A script injected through content
  rendered in such a block (for instance stored XSS via configuration or CMS data) was therefore
  trusted by the Content Security Policy, defeating CSP as a defence against XSS. In addition, the
  whitelist mode "all" could be enabled per store view and in production mode. Version 1.0.0 only
  whitelists static inline scripts that are literally present in the template file of a whitelisted
  block, no longer whitelists head.additional by default, and restricts mode "all" to the global
  scope and to non-production mode unless explicitly allowed in env.php.
